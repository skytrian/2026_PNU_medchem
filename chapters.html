<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter 18–26 | Pharmacology Recall</title>
<style>
body{margin:0;background:#0b1020;color:#edf2ff;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:30px 18px}.muted{color:#aab6d3}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#11182b;border:1px solid #2b3858;border-radius:16px;padding:18px}.card:hover{border-color:#7dd3fc}.num{color:#7dd3fc;font-size:13px}.btns{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}button{background:#11182b;color:#edf2ff;border:1px solid #2b3858;border-radius:10px;padding:10px 13px;cursor:pointer}button:hover{border-color:#7dd3fc}.quiz{max-width:760px;margin:20px auto}.img{background:white;border-radius:18px;min-height:340px;display:grid;place-items:center}.img img{max-width:90%;max-height:430px}.answer{background:#11182b;border:1px solid #2b3858;border-radius:14px;padding:16px;margin-top:14px}.hidden{display:none}.big{font-size:28px;font-weight:750}.tag{color:#7dd3fc}.progress{height:8px;background:#202b44;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#7dd3fc}.study{margin-top:18px}.study details{background:#11182b;border:1px solid #2b3858;border-radius:12px;padding:12px;margin:8px 0}summary{cursor:pointer;font-weight:650}a{color:#7dd3fc}
</style></head><body><main>
<h1>💊 Chapter별 Pharmacology Structure Recall</h1>
<p class="muted">18장부터 26장까지 챕터를 선택하여 해당 범위의 약물 구조만 반복합니다. 구조 → 약물명 → 용도/표적/MOA 순으로 학습하세요.</p>
<div class="btns" id="chapters"></div><section id="app"></section>
<p><a href="./index.html">← 전체 약물 DB / 기존 학습 페이지</a></p>
</main><script>
const data={
18:["심혈관계 기본 약물",["Dobutamine","Procainamide","Isosorbide mononitrate"]],
19:["이뇨제",["Acetazolamide","Hydrochlorothiazide","Trichlormethiazide","Furosemide","Bumetanide","Ethacrynic acid","Amiloride","Triamterene"]],
20:["RAAS 억제제",["Captopril","Enalapril","Lisinopril","Fosinopril","Losartan","Telmisartan","Candesartan","Olmesartan"]],
21:["Ca²⁺ channel blockers",["Verapamil","Nifedipine","Diltiazem","Amlodipine"]],
22:["혈관확장제 · β-blockers",["Hydralazine","Minoxidil","Carvedilol","Labetalol"]],
23:["지질저하제 · 비만치료제",["Simvastatin","Pravastatin","Atorvastatin","Rosuvastatin","Ezetimibe","Clofibrate","Gemfibrozil","Acipimox","Orlistat"]],
24:["항응고제 · 항혈소판제 · 지혈제",["Warfarin","Argatroban","Ximelagatran","Clopidogrel","Cilostazol","Dipyridamole","Tirofiban","Tranexamic acid"]],
25:["당뇨병 치료제",["Glipizide","Tolbutamide","Glimepiride","Rosiglitazone","Repaglinide","Glibenclamide","Nateglinide","Metformin","Sitagliptin","Saxagliptin","Vildagliptin","Acarbose","Miglitol","Empagliflozin"]],
26:["스테로이드 · 성호르몬 · 갑상선 · 골대사 · 진통/소염제",["Prednisolone","Dexamethasone","Triamcinolone acetonide","Estradiol","Testosterone","Tamoxifen","Raloxifene","Anastrozole","Letrozole","Finasteride","Liothyronine","Levothyroxine","Methimazole","Propylthiouracil","Etidronate","Alendronate","Ibuprofen","Acetaminophen","Diclofenac","Piroxicam","Sulindac","Celecoxib","Lumiracoxib","Naproxen","Mefenamic acid","Probenecid"]]};
const key="chapterRecallV1";let scores=JSON.parse(localStorage.getItem(key)||"{}"),ch=18,pool=[],i=0,revealed=false;
function url(n){return "https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/"+encodeURIComponent(n)+"/PNG?image_size=large"}
function save(){localStorage.setItem(key,JSON.stringify(scores))}
function drawButtons(){chapters.innerHTML=Object.entries(data).map(([n,v])=>{let done=v[1].filter(x=>scores[x]?.known).length;return '<button onclick="start('+n+')"><span class="tag">CH '+n+"</span> "+v[0]+" · "+done+"/"+v[1].length+"</button>"}).join("")}
function start(n){ch=n;pool=data[n][1];i=0;drawQuiz()}
function drawQuiz(){let n=pool[i],s=scores[n]||{seen:0,known:0,wrong:0};app.innerHTML='<div class="quiz"><h2>Chapter '+ch+" · "+data[ch][0]+"</h2><p class="muted">"+(i+1)+" / "+pool.length+" · "+n+"의 구조를 보고 약물명을 회상하세요.</p><div class="img"><img src=""+url(n)+"" alt="drug structure"></div><div id="ans" class="answer hidden"><div class="big">"+n+"</div><p class="muted">현재 학습 기록 · "+s.known+"회 기억 / "+s.wrong+"회 오답</p></div><div class="btns"><button onclick="reveal()">정답 보기</button><button onclick="grade(1)">✓ 알고 있었다</button><button onclick="grade(0)">✗ 몰랐다</button><button onclick="next()">다음 구조 →</button><button onclick="showList()">챕터 학습표</button></div></div>'}
function reveal(){ans.classList.remove("hidden");revealed=true}
function grade(ok){if(!revealed)reveal();let n=pool[i],s=scores[n]||{seen:0,known:0,wrong:0};s.seen++;ok?s.known++:s.wrong++;scores[n]=s;save();drawButtons();setTimeout(next,150)}
function next(){i=(i+1)%pool.length;revealed=false;drawQuiz()}
function showList(){app.innerHTML='<h2>Chapter '+ch+" · "+data[ch][0]+'</h2><div class="grid">'+pool.map(n=>'<article class="card"><img src="'+url(n)+'" loading="lazy" style="width:100%;height:160px;object-fit:contain;background:white;border-radius:10px"><h3>'+n+'</h3><p class="muted">기억 '+(scores[n]?.known||0)+' · 오답 '+(scores[n]?.wrong||0)+'</p></article>').join("")+'</div><div class="btns"><button onclick="start('+ch+')">구조 퀴즈 시작</button></div>'}
drawButtons();start(18);
</script></body></html>
